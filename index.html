<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport", content="width=device-width, initial-scale=1.0" />
        <title>Formulario Sena</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./_css/styles.css">
        
    </head>
    <body>
        <div class="container">
            <h1>📝 Formulario Sena V1</h1>

            <form id="miformulario">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                        placeholder="Escribe tu nombre completo"
                        autofocus
                        pattern="[A-za-z ]{3,40}" />
                </div>

                <!-- Campo de email -->
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="ejemplo@correo.com" />
                </div>

                <!-- Campo de número -->
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        min="18"
                        max="100"
                        required
                        placeholder="Tu edad" />
                </div>

                <!-- Campo de selección -->
                <div class="form-group">
                    <label for="ciudad">Elija una opcion:</label>
                    <select
                        id="ciudad"
                        name="ciudad"
                        required>   
                        <option value="">seleccione una opcion</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>

                <div>
                    <p>¿Planea comprar un auto movil nuevo en los proximos 5 años?</p>
                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="1">Si
                    </label>

                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="2">No
                    </label>

                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="3">TalVez
                    </label>
                </div>
                


                <div class="form-group">
                    <label for="ciudad">¿Cual es su marca de auto movil favorita?</label>
                    <select
                        id="ciudad"
                        name="ciudad"
                        required>   
                        <option value="">seleccione una opcion</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>

                <div>
                    <p>¿que tipo de transporte posee?</p>
                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="1">coche
                    </label>
                    
                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="2">barco
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="3">bicicleta
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="4">motocicleta
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="5">avion
                    </label>
                    
                </div>




                <!-- Área de texto -->
                <div class="form-group">
                    <label for="comentarios">¿algun comentario o sugerencia?</label>
                        <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        placeholder="Porfavor, introduzca sus comentarios (opcional)"></textarea>
                </div>

                <!-- Checkbox -->
                
                <div class="form-group">
                    <label
                        for="acepto"
                        style="display: inline; margin-left: 5px">
                        Acepto los términos y condiciones
                    </label>
                    <input
                        type="checkbox"
                        id="acepto"
                        name="acepto"
                        required />
                </div>

                <!-- Botón de envío -->
                <button type="submit" id="submit" value="submit">🚀 Enviar Formulario</button>
            </form>
                  <div id="modal-success" class="modal hidden">
            <div class="modal-content">
                <h2>¡Datos enviados con exito!</h2>
                <button id="close-modal">cerrar</button>
            </div>
        </div>
    </body>

    <script type="module" src="./_js/main.js"></script>
</html>
