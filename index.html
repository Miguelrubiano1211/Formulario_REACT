<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport", content="width=device-width, initial-scale=1.0" />
        <title>Formulario Sena</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./_css/styles.css">
    </head>
    <body>
        <div class="container">
            <h1>📝 Formulario Sena V1</h1>

            <form id="miFormulario">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                        placeholder="Escribe tu nombre completo"
                        autofocus
                        pattern="[A-za-z ]{3,40}" />
                </div>

                <!-- Campo de email -->
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="ejemplo@correo.com" />
                </div>

                <!-- Campo de número -->
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        min="18"
                        max="100"
                        required
                        placeholder="Tu edad" />
                </div>

                <!-- Campo de selección -->
                <div class="form-group">
                    <label for="ciudad">Elija una opcion:</label>
                    <select
                        id="ciudad"
                        name="ciudad"
                        required>   
                        <option value="">seleccione una opcion</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>

                <div>
                    <p>¿Planea comprar un auto movil nuevo en los proximos 5 años?</p>
                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="1">Si
                    </label>

                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="2">No
                    </label>

                    <label class="radio-contenedor">
                    <input type="radio" name="opcion" value="3">TalVez
                    </label>
                </div>
                


                <div class="form-group">
                    <label for="ciudad">¿Cual es su marca de auto movil favorita?</label>
                    <select
                        id="ciudad"
                        name="ciudad"
                        required>   
                        <option value="">seleccione una opcion</option>
                        <option value="bogota">Bogotá</option>
                        <option value="medellin">Medellín</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>

                <div>
                    <p>¿que tipo de transporte posee?</p>
                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="1">coche
                    </label>
                    
                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="2">barco
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="3">bicicleta
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="4">motocicleta
                    </label>

                    <label class="radio-contenedor">
                    <input type="checkbox" name="opcion" value="5">avion
                    </label>
                    
                </div>




                <!-- Área de texto -->
                <div class="form-group">
                    <label for="comentarios">¿algun comentario o sugerencia?</label>
                        <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        placeholder="Porfavor, introduzca sus comentarios (opcional)"></textarea>
                </div>

                <!-- Checkbox -->
                
                <div class="form-group">
                    <label
                        for="acepto"
                        style="display: inline; margin-left: 5px">
                        Acepto los términos y condiciones
                    </label>
                    <input
                        type="checkbox"
                        id="acepto"
                        name="acepto"
                        required />
                </div>

                <!-- Botón de envío -->
                <button type="submit">🚀 Enviar Formulario</button>
            </form>

            <div id="resultado" class="resultado">
                <h3>✅ ¡Formulario enviado exitosamente!</h3>
                <p>Estos son los datos que enviaste:</p>
                <div id="datosEnviados"></div>
            </div>
        </div>

        <!-- ÁREA DONDE SE MOSTRARÁN LOS RESULTADOS -->
        <div
            id="resultado"
            class="resultado">
            <h3>✅ ¡Formulario enviado exitosamente!</h3>
            <p>Estos son los datos que enviaste:</p>
            <div id="datosEnviados"></div>
        </div>

        <script>
            // 🎯 SIMULACIÓN DEL ENVÍO DEL FORMULARIO

            // Esperar a que el formulario sea enviado
            document
                .getElementById('miFormulario')
                .addEventListener('submit', function (evento) {
            // 1. Prevenir que la página se recargue (comportamiento por defecto)
                evento.preventDefault();

            // 2. Capturar todos los datos del formulario
                const formulario = evento.target;
                const datosFormulario = new FormData(formulario);

            // 3. Mostrar los datos en la consola (para estudiantes avanzados)
                console.log('📊 Datos del formulario:');
                for (let [campo, valor] of datosFormulario.entries()) {
                console.log(`${campo}: ${valor}`);
                }

            // 4. Convertir los datos a un formato legible
                let datosHTML = '';

            // Recorrer cada campo y crear HTML para mostrar
                for (let [campo, valor] of datosFormulario.entries()) {
            // Hacer más legibles los nombres de los campos
                let nombreCampo = campo;
                switch (campo) {
                    case 'nombre':
                        nombreCampo = 'Nombre completo';
                        break;
                    case 'email':
                        nombreCampo = 'Correo electrónico';
                        break;
                    case 'edad':
                        nombreCampo = 'Edad';
                        break;
                    case 'ciudad':
                        nombreCampo = 'Ciudad';
                        break;
                    case 'experiencia':
                        nombreCampo = 'Experiencia en programación';
                        break;
                    case 'color':
                        nombreCampo = 'Color favorito';
                        break;
                    case 'fecha':
                        nombreCampo = 'Fecha';
                        break;
                    case 'fechaHora':
                        nombreCampo = 'Fecha y hora';
                        break;
                    case 'archivo':
                        nombreCampo = 'Subir archivo';
                        break;
                    case 'imagen':
                        nombreCampo = 'Imagen como botón para resetear';
                        break;
                    case 'mes':
                        nombreCampo = 'Mes';
                        break;
                    case 'password':
                        nombreCampo = 'Contraseña';
                        break;
                    case 'rango':
                        nombreCampo = 'Rango';
                        break;
                    case 'busqueda':
                        nombreCampo = 'Buscar';
                        break;
                    case 'telefono':
                        nombreCampo = 'Telefono';
                        break;
                    case 'hora':
                        nombreCampo = 'Hora';
                        break;
                    case 'url':
                        nombreCampo = 'Sitio Web';
                        break;
                    case 'semana':
                        nombreCampo = 'Semana';
                        break;
                    case 'comentarios':
                        nombreCampo = 'Comentarios adicionales';
                        break;
                    case 'acepto':
                        nombreCampo = 'Términos aceptados';
                        break;
                }

            // Si el campo tiene valor, mostrarlo
                if (valor && valor.trim() !== '') {
                    datosHTML += `
                        <div class="dato">
                            <span class="etiqueta">${nombreCampo}:</span> ${valor}
                        </div>
                        `;
                    }
          }

            // 5. Mostrar los resultados en la página
                document.getElementById('datosEnviados').innerHTML = datosHTML;
                document.getElementById('resultado').style.display = 'block';

            // 6. Scroll suave hacia los resultados
                document.getElementById('resultado').scrollIntoView({
                behavior: 'smooth',
                });

            // 7. Mensaje de confirmación adicional
                alert(
                    '¡Formulario enviado correctamente! 🎉\nRevisa los datos más abajo.'
                    );
            });

            // 🎯 FUNCIONALIDAD EXTRA: Limpiar formulario
                function limpiarFormulario() {
                    document.getElementById('miFormulario').reset();
                    document.getElementById('resultado').style.display = 'none';
                }

            // Agregar botón de limpiar después del envío
                document.addEventListener('DOMContentLoaded', function () {
                    const contenedor = document.querySelector('.container');
                    const botonLimpiar = document.createElement('button');
                    botonLimpiar.innerHTML = '🗑️ Limpiar Formulario';
                    botonLimpiar.style.backgroundColor = '#f2f2f2';
                    botonLimpiar.style.marginTop = '10px';
                    botonLimpiar.onclick = limpiarFormulario;
                    contenedor.appendChild(botonLimpiar);
            });
        </script>
    </body>
</html>
